# Chặn index môi trường TEST (test.ws-jobshare.com). CHỈ thêm vào server {} của domain test, KHÔNG thêm vào prod.
# Báo cáo lỗi #14: domain test đang trả "index, follow".

server {
    # ... server_name test.ws-jobshare.com; (giữ nguyên cấu hình hiện có) ...

    # Áp cho mọi response (HTML, JS, ảnh) kể cả khi crawler bỏ qua robots.txt
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # robots.txt riêng cho môi trường test
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
}

# Kiểm tra sau khi reload:
#   curl -sI https://test.ws-jobshare.com/ja/business | grep -i x-robots-tag
#   curl -s  https://test.ws-jobshare.com/robots.txt
#   curl -sI https://ws-jobshare.com/ja/business | grep -i x-robots-tag   # prod: không được có
