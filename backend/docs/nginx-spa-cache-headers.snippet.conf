# SPA cache busting — include trong server {} trước `location /`
#
# - index.html + version.json: không cache → user luôn nhận bản mới sau deploy
# - /assets/* (Vite hash): cache 1 năm, immutable
#
# Sau khi sửa: sudo nginx -t && sudo systemctl reload nginx

location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
}

location = /version.json {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
}

location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# SPA fallback (/admin, /vi/..., …) — không cache shell HTML
location @spa_fallback {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files /index.html =404;
}
